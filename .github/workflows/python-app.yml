# Runs the regression and integration tests on the self-hosted runner for every push to main.

name: automated_testing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # uv finds .venv in the repository folder by itself, so no activation is needed
    - name: Create the virtual environment and install the package
      run: |
        uv venv --clear
        uv pip install -e .

    - name: Regression tests
      working-directory: test/regression_tests
      run: uv run pytest test_cases.py

    # also runs when the regression tests fail, so that both results are reported
    - name: Integration tests
      if: ${{ !cancelled() }}
      working-directory: test/integration_tests
      run: uv run pytest test_fluid.py